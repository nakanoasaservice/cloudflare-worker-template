# One virtual store per machine: every project and worktree's node_modules
# only holds symlinks into it, so dependencies are not copied again.
virtualStoreType: global

allowBuilds:
  esbuild: true
  workerd: true

# Vite+ ships its own builds of Vite and Vitest.
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

pmOnFail: download
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.0
  vite-plus: 1.7.0
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"

# Vite+ selects Node from package.json; do not let pnpm override CI matrices.
runtimeOnFail: ignore
